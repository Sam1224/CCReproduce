name: Daily paper patrol

on:
  workflow_dispatch:
    inputs:
      inspection_date:
        description: "Date directory to build, format YYYY-MM-DD. Leave empty to use Asia/Shanghai today."
        required: false
        type: string
  schedule:
    - cron: "0 16 * * *"

jobs:
  patrol:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch

      - name: Resolve inspection date
        id: date
        run: |
          if [ -n "${{ inputs.inspection_date }}" ]; then
            echo "value=${{ inputs.inspection_date }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(TZ=Asia/Shanghai date +%F)" >> "$GITHUB_OUTPUT"
          fi

      - name: Run patrol build
        run: |
          python scripts/patrol/run_daily_patrol.py --date-dir "${{ steps.date.outputs.value }}" --verify-reproductions
